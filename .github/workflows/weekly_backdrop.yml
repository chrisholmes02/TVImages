name: Weekly Backdrop Generator

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:   # allows manual trigger from the GitHub UI

jobs:
  generate-and-upload:
    name: Generate Backdrop & Push to Repo
    runs-on: ubuntu-latest

    # Pull the pre-built image — no pip/playwright install needed
    container:
      image: ghcr.io/chrisholmes02/tvimages:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      # ---------------------------------------------------------------------------
      # Set these in your repository Settings → Secrets and variables → Actions
      # ---------------------------------------------------------------------------
      GITHUB_TOKEN:      ${{ secrets.BACKDROP_GITHUB_TOKEN }}


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Ensure playwright and requests are available
        run: pip install --no-cache-dir "playwright==1.49.0" requests

      - name: Generate backdrop & upload to GitHub
        run: python generate_backdrop.py
 
      - name: Save backdrop as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: backdrop-${{ github.run_id }}
          path: backdrop.png
          retention-days: 14
