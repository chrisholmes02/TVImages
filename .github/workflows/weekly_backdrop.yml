name: Weekly Backdrop Generator

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:   # allows manual trigger from the GitHub UI

jobs:
  generate-and-upload:
    name: Generate Backdrop & Push to Repo
    runs-on: ubuntu-latest

    env:
      # ---------------------------------------------------------------------------
      # Set these in your repository Settings → Secrets and variables → Actions
      # ---------------------------------------------------------------------------
      GITHUB_TOKEN:      ${{ secrets.BACKDROP_GITHUB_TOKEN }}
      #GITHUB_REPO:      ${{ secrets.BACKDROP_GITHUB_REPO }}      # e.g. yourname/my-backdrops
      GITHUB_BRANCH:     ${{ vars.BACKDROP_BRANCH || 'main' }}
      #GITHUB_FILE_PATH: ${{ vars.BACKDROP_FILE_PATH || 'backdrop/backdrop.png' }}
      #BACKDROP_WIDTH:   ${{ vars.BACKDROP_WIDTH  || '1920' }}
      #BACKDROP_HEIGHT:  ${{ vars.BACKDROP_HEIGHT || '1080' }}
      #HEADLESS:         "true"

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out THIS repository (the one holding the workflow + script)
      # -----------------------------------------------------------------------
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 3. Install Python dependencies
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright requests

      # -----------------------------------------------------------------------
      # 4. Install Playwright browser (Chromium only, smaller footprint)
      # -----------------------------------------------------------------------
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # -----------------------------------------------------------------------
      # 5. Run the generator script
      # -----------------------------------------------------------------------
      - name: Generate backdrop & upload to GitHub
        run: python generate_backdrop.py

      # -----------------------------------------------------------------------
      # 6. (Optional) Upload the PNG as a workflow artifact for easy inspection
      # -----------------------------------------------------------------------
      - name: Save backdrop as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: backdrop-${{ github.run_id }}
          path: backdrop.png
          retention-days: 14