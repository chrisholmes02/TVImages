name: Create or Update File

on:
  workflow_dispatch:          # run manually from the Actions tab
    inputs:
      file_path:
        description: "Path of the file inside the repo"
        default: "hello.txt"
      file_content:
        description: "Content to write into the file"
        default: "Hello from GitHub Actions!"
      commit_message:
        description: "Commit message"
        default: "Update file via GitHub Actions"
      branch:
        description: "Target branch"
        default: "main"

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create or update file via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in, no setup needed
          REPO_OWNER:   ${{ github.repository_owner }}
          REPO_NAME:    ${{ github.event.repository.name }}
          FILE_PATH:    ${{ github.event.inputs.file_path }}
          FILE_CONTENT: ${{ github.event.inputs.file_content }}
          COMMIT_MESSAGE: ${{ github.event.inputs.commit_message }}
          BRANCH:       ${{ github.event.inputs.branch }}
        run: python github_update_file.py
